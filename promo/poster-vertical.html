<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
    font-family:"Kaiti SC","KaiTi","STKaiti","FangSong","SimSun",serif;}
  .poster{position:relative;width:1080px;height:1440px;background:#f3e8cd;}
  .scene{position:absolute;top:0;left:0;width:1080px;height:970px;object-fit:cover;object-position:center top;}
  .fade{position:absolute;top:770px;left:0;width:1080px;height:200px;
    background:linear-gradient(180deg,rgba(243,232,205,0),#f3e8cd);}
  .body{position:absolute;top:945px;left:0;width:1080px;text-align:center;color:#5a2c10;}
  .title{font-size:122px;font-weight:bold;letter-spacing:16px;}
  .sub{font-size:46px;letter-spacing:8px;color:#7a4a20;margin-top:10px;}
  .tag{font-size:38px;line-height:2;color:#4a3420;margin:30px auto 0;width:880px;}
  .url{display:inline-block;margin-top:46px;font-size:36px;color:#f3e8cd;background:#8a3a20;
    padding:18px 46px;border-radius:12px;letter-spacing:2px;box-shadow:0 4px 14px rgba(90,44,16,.3);}
  .badge{position:absolute;top:32px;right:32px;font-size:30px;color:#f3e8cd;background:rgba(90,44,16,.58);
    padding:12px 22px;border-radius:10px;letter-spacing:2px;}
</style></head>
<body>
  <div class="poster">
    <img class="scene" src="scene-street.png">
    <div class="fade"></div>
    <div class="badge">3D · 程序化生成</div>
    <div class="body">
      <div class="title">汴京漫游</div>
      <div class="sub">· 清明上河图 · 3D 沉浸画卷 ·</div>
      <div class="tag">走进会动的《清明上河图》<br>虹桥 · 汴河 · 10 家店铺 · 48 位宋人<br>可走 · 可聊 · 可接任务 · 打开即玩</div>
      <div class="url">点 我 即 刻 入 画</div>
    </div>
  </div>
</body></html>
