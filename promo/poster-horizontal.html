<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;
    font-family:"Kaiti SC","KaiTi","STKaiti","FangSong","SimSun",serif;}
  .poster{position:relative;width:1920px;height:1080px;overflow:hidden;}
  .scene{position:absolute;inset:0;width:1920px;height:1080px;object-fit:cover;}
  .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,35,15,0) 42%,rgba(60,35,15,.74) 100%);}
  .body{position:absolute;left:84px;bottom:84px;color:#f3e8cd;}
  .title{font-size:156px;font-weight:bold;letter-spacing:22px;text-shadow:0 6px 24px rgba(0,0,0,.55);}
  .sub{font-size:54px;letter-spacing:12px;color:#f0d9a8;margin-top:8px;text-shadow:0 3px 12px rgba(0,0,0,.5);}
  .tag{font-size:42px;line-height:1.9;color:#fff4de;margin-top:30px;width:1320px;text-shadow:0 2px 10px rgba(0,0,0,.5);}
  .url{position:absolute;right:96px;bottom:128px;font-size:44px;color:#f3e8cd;background:#8a3a20;
    padding:22px 54px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);letter-spacing:2px;}
</style></head>
<body>
  <div class="poster">
    <img class="scene" src="scene-aerial.png">
    <div class="veil"></div>
    <div class="body">
      <div class="title">汴京漫游</div>
      <div class="sub">· 清明上河图 · 3D 沉浸画卷 ·</div>
      <div class="tag">走进会动的《清明上河图》——虹桥、汴河、街市与 48 位宋人。<br>可走、可聊、可接任务。纯程序化生成，零安装，打开即玩。</div>
    </div>
    <div class="url">即刻入画</div>
  </div>
</body></html>
